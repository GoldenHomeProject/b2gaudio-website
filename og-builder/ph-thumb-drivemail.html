<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><style>
/* 512x512 Product Hunt thumbnail for DriveMail Voice. Must read at 240px. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px}
body{background:#0A0A0F;position:relative;overflow:hidden;
  font-family:-apple-system,"SF Pro Display",Arial,sans-serif}
.glow{position:absolute;width:640px;height:640px;border-radius:50%;
  left:50%;top:42%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(74,144,217,.36) 0%,rgba(74,144,217,0) 66%)}
.wrap{position:relative;width:100%;height:100%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:30px}
.logo{width:250px;height:250px;border-radius:56px;box-shadow:0 22px 50px rgba(0,0,0,.55)}
.line{font-size:46px;font-weight:800;letter-spacing:-.025em;color:#F5F5F7;
  line-height:1.08;text-align:center}
.line span{color:#6AAAF0}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <img class="logo" src="../drivemail-logo.png" alt="">
  <div class="line">Email, read aloud<br><span>on CarPlay</span></div>
</div>
</body></html>
