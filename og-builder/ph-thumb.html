<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px}
body{background:#0A0A0F;position:relative;overflow:hidden;
  font-family:-apple-system,"SF Pro Display",Arial,sans-serif}
.glow{position:absolute;width:640px;height:640px;border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,107,53,.34) 0%,rgba(255,107,53,0) 66%)}
.wrap{position:relative;width:100%;height:100%;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:34px}
/* waveform reads as audio even at 240px */
.wave{display:flex;align-items:center;justify-content:center;gap:11px;height:196px}
.wave i{width:20px;border-radius:10px;background:#FF6B35;display:block;
  box-shadow:0 0 26px rgba(255,107,53,.55)}
.wave i.d{background:#CC5529;opacity:.62}
.name{font-size:62px;font-weight:800;letter-spacing:-.03em;color:#F5F5F7;line-height:1}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="wave">
    <i class="d" style="height:64px"></i>
    <i style="height:124px"></i>
    <i style="height:196px"></i>
    <i style="height:100px"></i>
    <i style="height:158px"></i>
    <i class="d" style="height:70px"></i>
  </div>
  <div class="name">B2G</div>
</div>
</body></html>
